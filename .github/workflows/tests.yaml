name: "Run tests"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up DVC
      uses: iterative/setup-dvc@v1

    - name: Authenticate with Google Cloud
      run: |
        echo "${{ secrets.GCLOUD_AUTH }}" > gcloud-auth.json
        gcloud auth activate-service-account --key-file=gcloud-auth.json

    - name: Configure DVC Remote
      run: |
        dvc remote modify myremote gdrive_use_service_account true
        dvc remote modify myremote gdrive_service_account_json_path gcloud-auth.json

    - name: Pull Data with DVC
      run: |
        dvc pull -v
      env:
        GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_tests.txt

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

    - name: Test with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        pytest -v
